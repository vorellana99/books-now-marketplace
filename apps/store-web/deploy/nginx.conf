# Ejemplo de nginx para publicar la tienda en el MISMO origen que la API (ver el README de la tienda, sección Despliegue).
# Ajusta `server_name`, el certificado, la ruta de `dist/` y el puerto del backend.
server {
  listen 443 ssl http2;
  server_name tienda.example.com;
  # ssl_certificate     /etc/letsencrypt/live/tienda.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/tienda.example.com/privkey.pem;

  root /var/www/libroya/dist;

  # Comprimir: `vp preview` no comprime; el JS inicial pesa ~650 kB sin comprimir y ~195 kB con gzip
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # brotli on;   # si el módulo está instalado (mejor que gzip)

  # La API, en el mismo origen: se quita el prefijo /api (la barra final del proxy_pass lo hace)
  location /api/ {
    include /etc/nginx/snippets/libroya-security-headers.conf;
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # el límite de intentos cuenta por dirección: ver TRUST_PROXY
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;                     # sale en los logs del backend (código de soporte)
  }

  # Archivos con hash en el nombre: nunca cambian, se cachean un año
  location /assets/ {
    include /etc/nginx/snippets/libroya-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Todo lo demás es una ruta del cliente (/carrito, /pedidos/…): devuelve index.html, que no se cachea para que una versión
  # nueva llegue en la siguiente visita
  location / {
    include /etc/nginx/snippets/libroya-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
