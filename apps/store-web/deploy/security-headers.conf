# Cabeceras de seguridad de la tienda. Se incluyen en CADA `location` de nginx.conf: un `add_header` propio de un `location`
# descarta los del nivel superior, así que no basta con ponerlas en `server`. `always` hace que salgan también en los errores.
#
# La política de contenido (CSP) es la más estricta con la que la tienda funciona: todo viene del propio origen (la API también,
# por el mismo origen). Las pruebas e2e la aplican al build de producción y fallan si el navegador reporta una violación
# (`test/e2e/security.e2e.ts`): si se añade algo que necesite otra fuente (la pasarela de pago, una analítica), se amplía aquí
# con el origen exacto y se vuelve a ejecutar.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Las URL de la tienda no llevan secretos (ni tokens), pero un id de pedido tampoco tiene por qué salir hacia otro sitio
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Solo tiene efecto sobre HTTPS: si TLS lo termina un balanceador, ponerla allí
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
