name: store-web

on:
  push:
    branches: [main, develop]
    paths: ["apps/store-web/**", ".github/workflows/store-web.yml"]
  pull_request:
    paths: ["apps/store-web/**", ".github/workflows/store-web.yml"]

concurrency:
  group: store-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/store-web

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0 # la misma que fija `devEngines` y genera pnpm-lock.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/store-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Formato, lint con tipos y comprobación de tipos, todo junto (Vite+)
      - run: pnpm exec vp check

      # Unitarias y de componente (jsdom + MSW). El e2e con Playwright llega en el corte F6
      - run: pnpm exec vp test

      # `tsc` y la compilación de producción
      - run: pnpm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Falla solo con vulnerabilidades altas o críticas en dependencias de producción
      - run: pnpm audit --prod --audit-level=high
        working-directory: apps/store-web
